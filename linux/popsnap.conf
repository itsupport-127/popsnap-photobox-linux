# Pengaturan POPSNAP di Linux. Baris yang diberi tanda # memakai nilai bawaan. File ini TIDAK ditimpa saat update.
# Rahasia (kunci pembayaran, token) jangan di sini: taruh di /var/lib/popsnap/.env (izin 600).

#PORT=4000                      # JANGAN diubah: tampilan booth memanggil backend di port 4000
#POPSNAP_DATA=/var/lib/popsnap
#POPSNAP_LIBRARY=/var/lib/popsnap/library
#PUBLIC_HOST=192.168.1.50        # isi kalau alamat LAN yang terdeteksi salah (dipakai di QR/link unduh)

# --- Kiosk Chrome (popsnap-kiosk) ---
#CHROME_BIN=/usr/bin/google-chrome-stable
#KIOSK_AUTO_CAMERA=1             # izin kamera otomatis
#KIOSK_SILENT_PRINT=1            # cetak langsung ke printer bawaan CUPS
#KIOSK_EXTRA_FLAGS=
